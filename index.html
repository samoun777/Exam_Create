      overlay.querySelector(".fn-ok").addEventListener("click", confirm);
      overlay.querySelector(".fn-cancel").addEventListener("click", () => close(null));
      overlay.addEventListener("click", e => { if(e.target === overlay) close(null); });
    });
  }

  async function exportWord(mode){
    const fileName = await askFileName(defaultFileBase(mode), ".docx");
    if(!fileName) return;
    const btn = mode === "teacher" ? document.getElementById("dlToggleTeacher") : document.getElementById("dlToggleStudent");
    const originalHTML = btn.innerHTML;
    btn.textContent = "Building file…";
    btn.disabled = true;
    try{
      const zip = new JSZip();
      zip.file("[Content_Types].xml", CONTENT_TYPES_XML);
      zip.file("_rels/.rels", RELS_XML);
      zip.file("word/document.xml", buildDocumentXml(mode));
      zip.file("word/styles.xml", STYLES_XML);
      zip.file("word/_rels/document.xml.rels", DOC_RELS_XML);
      const blob = await zip.generateAsync({
        type: "blob",
        mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
      });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    } catch(err){
      alert("Sorry, the Word file could not be created. Please try again.");
      console.error(err);
    } finally {
      btn.innerHTML = originalHTML;
      btn.disabled = false;
    }
  }
  const JSPDF_CDN_URL = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
  function ensureJsPDF(){
    if(window.jspdf && window.jspdf.jsPDF) return Promise.resolve();
    return new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = JSPDF_CDN_URL;
      s.onload = () => resolve();
      s.onerror = () => reject(new Error("Could not load the PDF library."));
      document.head.appendChild(s);
    });
  }

  function plainFillText(text, blankSize){
    const blank = "_".repeat(Math.max(4, Math.round((blankSize || 20) * 0.55)));
    const t = text || "";
    if(/\.{3,}/.test(t)) return t.replace(/\.{3,}/g, blank);
    return (t || "(question text)") + " " + blank;
  }

  function buildPDFDoc(mode){
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: "pt", format: "a4" });
    const PAGE_W = 595.28, PAGE_H = 841.89, MARGIN = 56.7;
    const CONTENT_W = PAGE_W - MARGIN * 2;
    const Q_INDENT = 22;   
    const SUB_INDENT = 38; 
    let y = MARGIN;

    function ensure(space){
      if(y + space > PAGE_H - MARGIN){
        doc.addPage();
        y = MARGIN;
      }
    }
    function setF(style, size){
      doc.setFont("times", style);
      doc.setFontSize(size);
    }
    function wrapped(text, x, width, size, style){
      setF(style, size);
      const lines = doc.splitTextToSize(text || "", width);
      lines.forEach(line => {
        ensure(size * 1.35);
        doc.text(line, x, y);
        y += size * 1.35;
      });
    }
    function drawTable(rows, colWidths, rowH, startX){
      const x0 = startX == null ? MARGIN : startX;
      const tableW = colWidths.reduce((a, b) => a + b, 0);
      ensure(rowH * rows.length);
      const top = y;
      doc.setLineWidth(0.75);
      doc.rect(x0, top, tableW, rowH * rows.length);
      let xAcc = x0;
      for(let c = 1; c < colWidths.length; c++){ xAcc += colWidths[c-1]; doc.line(xAcc, top, xAcc, top + rowH * rows.length); }
      for(let r = 1; r < rows.length; r++){ doc.line(x0, top + rowH * r, x0 + tableW, top + rowH * r); }
      rows.forEach((row, ri) => {
        let xC = x0;
        row.forEach((cell, ci) => {
          setF(cell.bold ? "bold" : "normal", 11);
          if(cell.color) doc.setTextColor(cell.color[0], cell.color[1], cell.color[2]);
          doc.text(String(cell.text), xC + 7, top + rowH * ri + rowH / 2 + 4, { maxWidth: colWidths[ci] - 14 });
          doc.setTextColor(0, 0, 0);
          xC += colWidths[ci];
        });
      });
      y = top + rowH * rows.length + 12;
    }
    function drawLines(count, indent, width){
      const x0 = MARGIN + indent;
      const w = width == null ? (CONTENT_W - indent) : width;
      for(let i = 0; i < count; i++){
        ensure(20);
        doc.setLineWidth(0.75);
        doc.line(x0, y, x0 + w, y);
        y += 20;
      }
      y += 6;
    }

    // Name / Class / Date / Score box
    ensure(60);
    const boxTop = y, halfW = CONTENT_W / 2, rowH0 = 26;
    doc.setLineWidth(0.75);
    doc.rect(MARGIN, boxTop, CONTENT_W, rowH0 * 2);
    doc.line(MARGIN + halfW, boxTop, MARGIN + halfW, boxTop + rowH0 * 2);
    doc.line(MARGIN, boxTop + rowH0, MARGIN + CONTENT_W, boxTop + rowH0);
    setF("bold", 11);
    const lineY1 = boxTop + 19, lineY2 = boxTop + rowH0 + 19;
    doc.setLineWidth(0.75);

    // Name — blank line fills the rest of its cell
    doc.text("Name:", MARGIN + 8, boxTop + 17);
    doc.line(MARGIN + 8 + doc.getTextWidth("Name:") + 8, lineY1, MARGIN + halfW - 10, lineY1);

    // Class — blank line fills the rest of its cell
    doc.text("Class:", MARGIN + halfW + 8, boxTop + 17);
    doc.line(MARGIN + halfW + 8 + doc.getTextWidth("Class:") + 8, lineY1, MARGIN + CONTENT_W - 10, lineY1);

    // Date — blank line fills the rest of its cell
    doc.text("Date:", MARGIN + 8, boxTop + rowH0 + 17);
    doc.line(MARGIN + 8 + doc.getTextWidth("Date:") + 8, lineY2, MARGIN + halfW - 10, lineY2);

    // Score — a deliberately longer blank line than the others (this is
    // where a number gets written, so it gets the most room), with the
    // "/ total" mark placed right after it if a total score was set.
    doc.text("Score:", MARGIN + halfW + 8, boxTop + rowH0 + 17);
    const scoreLineStart = MARGIN + halfW + 8 + doc.getTextWidth("Score:") + 8;
    const scoreLineEnd = MARGIN + CONTENT_W - (state.meta.totalScore ? 46 : 10);
    doc.line(scoreLineStart, lineY2, scoreLineEnd, lineY2);
    if(state.meta.totalScore){
      setF("bold", 11);
      doc.text("/ " + state.meta.totalScore, scoreLineEnd + 6, boxTop + rowH0 + 17);
    }
    y = boxTop + rowH0 * 2 + 28;

    // Title
    setF("bold", 18);
    doc.text(state.meta.title || "Untitled Exam", PAGE_W / 2, y, { align: "center" });
    y += 20;
    const subBits = [state.meta.subject, state.meta.className].filter(Boolean).join("   •   ");
    if(subBits){ setF("italic", 11); doc.text(subBits, PAGE_W / 2, y, { align: "center" }); y += 18; }

    const footBits = [];
    if(state.meta.teacher) footBits.push("Teacher: " + state.meta.teacher);
    if(state.meta.duration) footBits.push("Duration: " + state.meta.duration);
    if(footBits.length){ setF("italic", 10); doc.text(footBits.join("     "), PAGE_W / 2, y, { align: "center" }); y += 20; }
    else y += 6;

    if(state.sections.length === 0){
      setF("italic", 11);
      doc.text("(No parts added yet.)", MARGIN, y);
    }

    state.sections.forEach((sec, si) => {
      ensure(28);
      const romanText = toRoman(si) + ".";
      setF("bold", 14);
      doc.text(romanText, MARGIN, y);
      if(sec.note){
        const romanW = doc.getTextWidth(romanText);
        setF(sec.noteBold ? "bold" : "normal", 12);
        const noteLines = doc.splitTextToSize(sec.note, CONTENT_W - romanW - 6);
        doc.text(noteLines[0], MARGIN + romanW + 6, y);
        y += 20;
        for(let i = 1; i < noteLines.length; i++){ ensure(18); doc.text(noteLines[i], MARGIN, y); y += 18; }
      } else {
        y += 22;
      }

      sec.questions.forEach((q, qi) => {
        const qNum = (qi + 1) + ". ";
        const scoreSuffix = q.score ? "   (" + q.score + " pts)" : "";
        const qX = MARGIN + Q_INDENT;
        const qW = CONTENT_W - Q_INDENT;
        const subX = MARGIN + SUB_INDENT;
        const subW = CONTENT_W - SUB_INDENT;

        if(q.type === "fill"){
          wrapped(qNum + plainFillText(q.text, q.blankSize) + scoreSuffix, qX, qW, 12, "normal");
          if(mode === "teacher" && q.answer){
            ensure(16); setF("bold", 11); doc.setTextColor(31, 66, 56);
            doc.text("Answer: " + q.answer, subX, y); doc.setTextColor(0, 0, 0); y += 16;
          }
          y += 6;
        } else if(q.type === "mc"){
          wrapped(qNum + (q.text || "(question text)") + scoreSuffix, qX, qW, 12, "normal");
          q.options.forEach((opt, oi) => {
            ensure(17);
            const isCorrect = mode === "teacher" && opt.correct;
            doc.setLineWidth(0.75);
            if(isCorrect){ doc.setFillColor(31, 66, 56); doc.rect(subX, y - 9, 9, 9, "F"); doc.setTextColor(31, 66, 56); setF("bold", 11); }
            else { doc.rect(subX, y - 9, 9, 9); setF("normal", 11); }
            doc.text(toLetter(oi) + ". " + (opt.text || "(choice)"), subX + 16, y);
            doc.setTextColor(0, 0, 0);
            y += 17;
          });
          y += 6;
        } else if(q.type === "match"){
          wrapped(qNum + (q.text || "Match the items below.") + scoreSuffix, qX, qW, 12, "normal");
          const n = q.pairs.length;
          if(!q.shuffle || q.shuffle.length !== n) q.shuffle = shuffledIndices(n, q.id + "_" + n);
          const rows = q.pairs.map((p, pi) => {
            if(mode === "teacher"){
              return [ { text: "(" + toLetter(pi) + ")  " + (pi+1) + ". " + (p.left || "(item)") }, { text: p.right || "(match)", bold:true, color:[31,66,56] } ];
            }
            const rightPair = q.pairs[q.shuffle[pi]];
            return [ { text: "(     )  " + (pi+1) + ". " + (p.left || "(item)") }, { text: toLetter(pi) + ". " + (rightPair.right || "(match)") } ];
          });
          drawTable(rows, [subW * 0.55, subW * 0.45], 24, subX);
        } else if(q.type === "short"){
          wrapped(qNum + (q.text || "(question text)") + scoreSuffix, qX, qW, 12, "normal");
          if(mode === "teacher" && q.answer){
            ensure(16); setF("bold", 11); doc.setTextColor(31, 66, 56);
            doc.text("Model answer: " + q.answer, subX, y); doc.setTextColor(0, 0, 0); y += 16;
          } else {
            drawLines(Math.max(1, q.lines || 1), SUB_INDENT, subW);
          }
        } else if(q.type === "writing"){
          wrapped(qNum + (q.text || "(writing prompt)") + scoreSuffix, qX, qW, 12, "normal");
          if(mode === "teacher" && q.notes){
            ensure(16); setF("bold", 11); doc.setTextColor(31, 66, 56);
            doc.text("Grading notes: " + q.notes, subX, y); doc.setTextColor(0, 0, 0); y += 16;
          } else if(q.showLines){
            drawLines(Math.max(1, q.lineCount || 12), SUB_INDENT, subW);
          } else {
            ensure(140);
            doc.setDrawColor(150); doc.setLineWidth(0.75);
            doc.rect(subX, y, subW, 130);
            doc.setDrawColor(0);
            y += 140;
          }
        }
      });
    });

    const totalPages = doc.internal.getNumberOfPages();
    for(let i = 1; i <= totalPages; i++){
      doc.setPage(i);
      doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.setTextColor(140);
      doc.text("Page " + i + " of " + totalPages, PAGE_W - MARGIN, PAGE_H - 28, { align: "right" });
      doc.setTextColor(0, 0, 0);
    }
    return doc;
  }

  async function exportPDF(mode){
    const fileName = await askFileName(defaultFileBase(mode), ".pdf");
    if(!fileName) return;
    const btn = mode === "teacher" ? document.getElementById("dlToggleTeacher") : document.getElementById("dlToggleStudent");
    const originalHTML = btn.innerHTML;
    btn.textContent = "Building PDF…";
    btn.disabled = true;
    try{
      await ensureJsPDF();
      const doc = buildPDFDoc(mode);
      doc.save(fileName);
    } catch(err){
      alert("Sorry, the PDF could not be created. Please try again.");
      console.error(err);
    } finally {
      btn.innerHTML = originalHTML;
      btn.disabled = false;
    }
  }
  function setupDownloadDropdown(toggleId, menuId){
    const toggleBtn = document.getElementById(toggleId);
    const menu = document.getElementById(menuId);
    if(!toggleBtn || !menu) return;
    toggleBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      const willOpen = menu.classList.contains("hidden");
      document.querySelectorAll(".dl-dropdown").forEach(m => m.classList.add("hidden"));
      if(willOpen) menu.classList.remove("hidden");
    });
    menu.addEventListener("click", (e) => {
      const t = e.target.closest("[data-act]");
      if(!t) return;
      const mode = t.dataset.mode;
      if(t.dataset.act === "dl-word") exportWord(mode);
      else if(t.dataset.act === "dl-pdf") exportPDF(mode);
      menu.classList.add("hidden");
    });
  }
  setupDownloadDropdown("dlToggleTeacher", "dlMenuTeacher");
  setupDownloadDropdown("dlToggleStudent", "dlMenuStudent");
  document.addEventListener("click", (e) => {
    document.querySelectorAll(".dl-dropdown").forEach(m => {
      if(!m.contains(e.target)) m.classList.add("hidden");
    });
  });

  // ---------- Seed with one example ----------
  function seedExample(){
    state.meta = {
      title: "Sample Quiz — General Knowledge",
      subject: "General Knowledge",
      className: "Grade 6",
      teacher: "",
      date: "",
      duration: "30 minutes",
      totalScore: "20"
    };
    const s1 = newSection("fill");
    s1.note = "Basic facts";
    const q1 = newQuestion("fill"); q1.text = "The sun rises in the ....."; q1.answer = "East"; q1.score = "5"; q1.blankSize = 10;
    s1.questions.push(q1);

    const s2 = newSection("mc");
    s2.note = "Choose the correct answer by putting a check in the box.";
    const q2 = newQuestion("mc");
    q2.text = "Which of these is a fruit?";
    q2.options = [{text:"Carrot",correct:false},{text:"Apple",correct:true},{text:"Potato",correct:false}];
    q2.score = "5";
    s2.questions.push(q2);

    const s3 = newSection("match");
    s3.note = "Animals and the sounds they make";
    const q3 = newQuestion("match");
    q3.pairs = [{left:"Dog", right:"Bark"}, {left:"Cat", right:"Meow"}, {left:"Cow", right:"Moo"}];
    q3.score = "10";
    s3.questions.push(q3);

    state.sections = [s1, s2, s3];
    activeSectionId = s1.id;
  }

  const restoredFromStorage = loadState();
  if(!restoredFromStorage){ seedExample(); }
  initDelegatedEvents();
  const clearBtn = document.getElementById("clearDataBtn");
  if(clearBtn) clearBtn.addEventListener("click", clearAllData);
  const clearQuestionsBtn = document.getElementById("clearQuestionsBtn");
  if(clearQuestionsBtn) clearQuestionsBtn.addEventListener("click", clearQuestionsOnly);

  const menuToggleBtn = document.getElementById("menuToggleBtn");
  const menuDropdown = document.getElementById("menuDropdown");
  if(menuToggleBtn && menuDropdown){
    menuToggleBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      menuDropdown.classList.toggle("hidden");
    });
    document.addEventListener("click", (e) => {
      if(!menuDropdown.classList.contains("hidden") && !menuDropdown.contains(e.target) && e.target !== menuToggleBtn){
        menuDropdown.classList.add("hidden");
      }
    });
    menuDropdown.addEventListener("click", (e) => {
      const guideBtn = e.target.closest('[data-act="menu-guide"]');
      if(guideBtn){
        showGuide = !showGuide;
        renderBuilder();
      }
      menuDropdown.classList.add("hidden");
    });
  }

  renderBuilder();
  renderPreview();
  updateHeaderHeightVar();
})();
</script>
